# Managed by the factory kit: `factory update` overwrites this file. Configure the worker in factory.json.
name: Factory worker

# Label an issue `factory` (or comment `@claude` on an issue or PR) and a Claude Code agent builds it
# on a branch, proves it, and opens a PR. It never merges. You do.
# Pause everything: Settings → Secrets and variables → Actions → Variables → FACTORY_PAUSED = true

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: factory-worker-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  work:
    if: >-
      vars.FACTORY_PAUSED != 'true' && (
        (github.event_name == 'issues' && github.event.label.name == 'factory' && github.actor == github.repository_owner) ||
        (github.event_name != 'issues' && contains(github.event.comment.body, '@claude') && github.event.comment.user.login == github.repository_owner)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Read factory.json
        id: cfg
        run: |
          echo "node=$(jq -r '.node // "22"' factory.json)" >> "$GITHUB_OUTPUT"
          echo "app=$(jq -r 'if .app then "true" else "false" end' factory.json)" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ steps.cfg.outputs.node }}
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}

      - name: Install dependencies
        run: node .factory/gates.mjs --setup-only

      - name: Install browser
        if: steps.cfg.outputs.app == 'true'
        run: node .factory/verify.mjs --install

      - name: Build worker arguments
        id: args
        run: |
          {
            echo "claude_args<<FACTORY_EOF"
            node .factory/config.mjs worker-args
            echo
            echo "FACTORY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Issue label → autonomous run with the factory playbook. Comments → interactive (@claude) mode.
          prompt: ${{ github.event_name == 'issues' && format('Work GitHub issue #{0} in {1} end to end using the factory-worker skill in .claude/skills/factory-worker/SKILL.md. Read AGENTS.md and factory.json first. Create your own branch named factory/issue-{0}-<short-slug>; never commit or push to the protected branch and never merge. Prove the change with `node .factory/gates.mjs` (and the factory-verify skill for UI changes), then open a PR with gh pr create following .github/pull_request_template.md, and comment the PR link on the issue. If you hit a blocker, comment on the issue explaining it and stop.', github.event.issue.number, github.repository) || '' }}
          claude_args: ${{ steps.args.outputs.claude_args }}
